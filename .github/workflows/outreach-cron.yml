# Runs the outreach scheduler every 5 minutes: scans connected inboxes for replies, sends due
# campaign emails from reps' inboxes, and paces calls. Needs two repository secrets:
#   APP_URL      e.g. https://your-app.vercel.app
#   CRON_SECRET  same value as the app's CRON_SECRET env var
name: Outreach scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger dispatcher
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET secrets not set; skipping."; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/dispatch"
