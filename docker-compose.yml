# Runs the app, HTTPS (Caddy + Let's Encrypt) and the 5-minute scheduler on one server.
# All settings come from .env next to this file (see deploy/AWS.md).
#   docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    expose: ["3000"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # Sends due emails, scans inboxes and paces calls every 5 minutes.
  scheduler:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do sleep 300; curl -sS --max-time 120 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/dispatch; echo; done'
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:
